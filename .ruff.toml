line-length = 88
target-version = "py314"

[lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "W",      # pycodestyle warnings
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "FURB",   # refurb
]

[lint.per-file-ignores]
"tests/**" = [
    "E501",   # long assertions and sample records read better on one line
]
